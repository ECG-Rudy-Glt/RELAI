version: 2

project_name: relai

before:
  hooks:
    - go mod tidy

builds:
  - id: relai
    main: ./cmd/relai
    binary: relai
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: relai
    ids: [relai]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: ECG-Rudy-Glt
    name: RELAI
