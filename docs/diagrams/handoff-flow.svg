<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 550" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="t">What happens at session start</title>
<desc id="d">The session hook runs relai handoff. The command reads git, Beads or GitHub Issues, OpenSpec and the notes read-only, applies a token budget and produces the text the agent reads. With no source at all it falls back to a degraded mode.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b2a1d"/></marker></defs>
<rect width="520" height="550" rx="12" fill="#ece6d9"/>
<rect x="60" y="14" width="400" height="54" rx="6" fill="#fbf6ec" stroke="#6f5a45" stroke-width="1.5"/>
<text x="260.0" y="36.4" text-anchor="middle" font-size="14" fill="#3b2a1d">Session start</text>
<text x="260.0" y="55.4" text-anchor="middle" font-size="14" fill="#3b2a1d">SessionStart hook (or AGENTS.md)</text>
<line x1="260" y1="68" x2="260" y2="94" stroke="#3b2a1d" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60" y="94" width="400" height="36" rx="18.0" fill="#8f4f25"/>
<text x="260.0" y="116.9" text-anchor="middle" font-size="14" fill="#fbf6ec" font-weight="700">relai handoff</text>
<line x1="260" y1="130" x2="260" y2="156" stroke="#3b2a1d" stroke-width="2" marker-end="url(#ar)"/>
<rect x="12" y="156" width="496" height="214" rx="10" fill="#e6dfce" stroke="#cdbfa5" stroke-width="1.5"/>
<text x="26" y="178" text-anchor="start" font-size="14" fill="#6f5a45" font-weight="700">Sources read, read-only</text>
<rect x="28" y="192" width="222" height="36" rx="6" fill="#fbf6ec" stroke="#6f5a45" stroke-width="1.5"/>
<text x="139.0" y="214.9" text-anchor="middle" font-size="14" fill="#3b2a1d">git: state and commits</text>
<rect x="270" y="192" width="222" height="36" rx="6" fill="#fbf6ec" stroke="#6f5a45" stroke-width="1.5"/>
<text x="381.0" y="214.9" text-anchor="middle" font-size="14" fill="#3b2a1d">Beads or GitHub Issues</text>
<rect x="28" y="238" width="222" height="36" rx="6" fill="#fbf6ec" stroke="#6f5a45" stroke-width="1.5"/>
<text x="139.0" y="260.9" text-anchor="middle" font-size="14" fill="#3b2a1d">OpenSpec: changes</text>
<rect x="270" y="238" width="222" height="36" rx="6" fill="#fbf6ec" stroke="#6f5a45" stroke-width="1.5"/>
<text x="381.0" y="260.9" text-anchor="middle" font-size="14" fill="#3b2a1d">.relai/notes.md</text>
<rect x="28" y="284" width="464" height="36" rx="6" fill="#fbf6ec" stroke="#8c4a3a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260.0" y="306.6" text-anchor="middle" font-size="13" fill="#3b2a1d">no source at all: degraded mode (git only)</text>
<text x="260" y="336" text-anchor="middle" font-size="13" fill="#6f5a45">Contradicting sources: both shown, never settled</text>
<line x1="260" y1="376" x2="260" y2="402" stroke="#3b2a1d" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60" y="402" width="400" height="54" rx="6" fill="#fbf6ec" stroke="#6f5a45" stroke-width="1.5"/>
<text x="260.0" y="424.4" text-anchor="middle" font-size="14" fill="#3b2a1d">Token budget (2,000 by default)</text>
<text x="260.0" y="443.4" text-anchor="middle" font-size="14" fill="#3b2a1d">the text is trimmed to fit</text>
<line x1="260" y1="456" x2="260" y2="482" stroke="#3b2a1d" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60" y="482" width="400" height="54" rx="6" fill="#4f5f38"/>
<text x="260.0" y="504.4" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">Text read by the agent</text>
<text x="260.0" y="523.4" text-anchor="middle" font-size="14" fill="#ffffff">state, tasks, changes, decisions, pitfalls</text>
</svg>
